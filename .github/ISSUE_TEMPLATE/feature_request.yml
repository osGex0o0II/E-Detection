name: 功能建议
description: 提出范围明确、可验证的改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请先搜索现有 Issue，并说明当前限制与预期结果。

        安全问题请按 [安全策略](https://github.com/osGex0o0II/E-Detection/blob/main/SECURITY.md) 私下报告。
  - type: dropdown
    id: area
    attributes:
      label: 相关区域
      options:
        - 检测规则与阈值
        - CSV 解析与列名识别
        - 报告与导出
        - 工作台与设置
        - 安装、更新与通知
        - 文档与开发体验
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题或需求
      description: 描述当前限制、使用场景和受影响用户。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望行为、输入输出或界面变化。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
      description: 可列出已考虑的替代做法或现有绕过方式。
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可附示例数据、截图或相关链接；请先移除敏感信息。
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: 确认
      options:
        - label: 已搜索现有 Issue，未发现重复。
          required: true
