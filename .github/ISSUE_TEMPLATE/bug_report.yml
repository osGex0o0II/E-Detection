name: 缺陷报告
description: 报告可复现的安装、更新或检测问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索现有 Issue，并移除日志中的路径、设备名、密钥等敏感信息。

        安全漏洞请勿在此公开，按 [安全策略](https://github.com/osGex0o0II/E-Detection/blob/main/SECURITY.md) 私下报告。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 应用“关于”中显示的版本，或 Release 标签。
      placeholder: v2.0.3
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 安装方式
      options:
        - 安装器（EDetection-Setup-win-x64.exe）
        - 便携 ZIP
        - 源码构建
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 24H2（26100）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 提供最小、可重复的操作步骤。
      placeholder: |
        1. 打开……
        2. 选择……
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 可粘贴错误信息、运行日志或截图；请先移除敏感信息。
      render: text
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: 确认
      options:
        - label: 已搜索现有 Issue，未发现重复。
          required: true
        - label: 已移除日志、截图和配置中的敏感信息。
          required: true
